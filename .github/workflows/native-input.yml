name: Native input

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-input:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - run: Tests/NativeSession/NativeInputEngineQA/run.sh
      - run: scripts/prepare-dependencies.sh
      - run: scripts/test-direct-input.sh --native-editing
